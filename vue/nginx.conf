# 前端容器的 nginx 站点配置。挂在 /etc/nginx/conf.d/default.conf
# 覆盖镜像自带的那份 default.conf。

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 静态产物体积不小(vue + vite 打出来是一个大 chunk),开 gzip 值。
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # vite 打出来的资源名带内容 hash,可以放心长缓存。
  # ★ 不要对 index.html 这么做 —— 它名字不带 hash,缓存住就再也更新不了。
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA 路由回退:vue-router 的 history 模式刷新子路由时,这些路径在磁盘上不存在,
  # 必须回退到 index.html,否则刷新即 404。
  location / {
    try_files $uri $uri/ /index.html;
  }

  # /api 反代到后端容器。`server` 是 compose 里的服务名,由 Docker 内嵌 DNS 解析。
  location /api/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ★ 上传闸门,必须按**请求体总量**给,不能照抄后端的单文件上限。
    #   后端 multipart 限的是"单文件 25MB × 最多 12 个"(app.ts:44),
    #   而 nginx 这一项限的是整个请求体。照抄 25m 会让稍大的多图请求
    #   在 nginx 就被 413 挡掉 —— 而且 nginx 的 413 是它自己的裸响应,
    #   **不走项目那套 { error: { code, message } } 错误体**(README 已为此
    #   提醒前端两种都要认,没必要再添第三种来源)。
    #   这里按 12 × 25MB 对齐,让这道闸永远不早于后端触发。
    client_max_body_size 300m;

    # 对话 agent 那条路是一次请求内等模型回话(实测 qwen-flash 约 0.85s/轮,
    # 但真实模型 + 多轮工具调用可能到十秒量级)。nginx 缺省 60s,留点余量。
    # 出图不走这里:它是异步任务,接口只回 202,长活儿在后台。
    proxy_read_timeout 120s;
  }
}
